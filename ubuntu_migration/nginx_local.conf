# Jeepney NVans - Local WSL Nginx Configuration
# Points directly to the mounted Windows folder for professional local testing.

# --- H2C Smuggling Mitigation ---
# Only allow "websocket" as a valid Upgrade value. Any other value
# (e.g. "h2c") is silently dropped, preventing protocol-smuggling attacks.
map $http_upgrade $ws_upgrade {
    default   "";         # strip unknown Upgrade values
    websocket websocket;  # pass through only "websocket"
}
map $http_upgrade $ws_connection {
    default   close;      # close for non-upgrade requests
    websocket upgrade;    # upgrade only for websocket
}

server {
    listen 80;
    listen [::]:80;

    server_name localhost; 

    # Point directly to your local Windows mounted public folder
    root /mnt/c/xampp2/htdocs/jeepneynvans/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Allow photo uploads up to 25M
    client_max_body_size 25M;

    # Access and Error Logs
    access_log /var/log/nginx/jeepney_local_access.log;
    error_log /var/log/nginx/jeepney_local_error.log;

    # Core routing logic for CodeIgniter 4
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Prevent direct access to writable directory or system resources
    location ~* ^/(app|system|writable)/ {
        deny all;
        return 404;
    }

    # WebSocket reverse proxy for real-time queue updates.
    # Forwards same-origin ws://localhost/ws to the PHP WS server on 127.0.0.1:8081
    # (started by start_system.bat via `php spark ws:serve`).
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection $ws_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # PHP-FPM FastCGI Configuration.
    # NOTE: wsl_local_up.sh and install_linux.sh rewrite this socket path at
    # runtime to match the PHP-FPM version installed (e.g. php8.5-fpm.sock).
    # IMPORTANT: PHP-FPM writes its socket to /run/php/. On most systems
    # /var/run is a symlink to /run, but in some minimal WSL installs this
    # symlink may be missing. The bring-up scripts create /var/run/php and
    # symlink the socket if needed.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        fastcgi_pass unix:/run/php/php-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        fastcgi_read_timeout 600;
    }
}
