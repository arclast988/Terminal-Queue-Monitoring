# Jeepney NVans - Local WSL Nginx Configuration
# Points directly to the mounted Windows folder for professional local testing.

server {
    listen 80;
    listen [::]:80;

    server_name localhost; 

    # Point directly to your local Windows mounted public folder
    root /mnt/c/xampp2/htdocs/jeepneynvans/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Access and Error Logs
    access_log /var/log/nginx/jeepney_local_access.log;
    error_log /var/log/nginx/jeepney_local_error.log;

    # Core routing logic for CodeIgniter 4
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Prevent direct access to writable directory or system resources
    location ~* ^/(app|system|writable)/ {
        deny all;
        return 404;
    }

    # PHP-FPM FastCGI Configuration.
    # NOTE: start_system.bat rewrites this socket path at runtime to match the
    # PHP-FPM version actually installed in WSL (e.g. php8.2-fpm.sock).
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        fastcgi_read_timeout 600;
    }
}
