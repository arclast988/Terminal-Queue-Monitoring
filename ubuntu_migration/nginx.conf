# Jeepney NVans Nginx Configuration
# Place this file in: /etc/nginx/sites-available/jeepneynvans
# Then create a symlink: ln -s /etc/nginx/sites-available/jeepneynvans /etc/nginx/sites-enabled/

# --- H2C Smuggling Mitigation ---
# Only allow "websocket" as a valid Upgrade value. Any other value
# (e.g. "h2c") is silently dropped, preventing protocol-smuggling attacks.
map $http_upgrade $ws_upgrade {
    default   "";         # strip unknown Upgrade values
    websocket websocket;  # pass through only "websocket"
}
map $http_upgrade $ws_connection {
    default   close;      # close for non-upgrade requests
    websocket upgrade;    # upgrade only for websocket
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain or domain IP address
    server_name _; 

    # Point to the CodeIgniter 'public' folder for security
    root /var/www/jeepneynvans/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Access and Error Logs
    access_log /var/log/nginx/jeepneynvans_access.log;
    error_log /var/log/nginx/jeepneynvans_error.log;

    # Max upload size (adjust if you need to upload larger files)
    client_max_body_size 20M;

    # Gzip compression for text-based assets (performance)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Core routing logic for CodeIgniter 4
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Prevent direct access to writable directory or system resources
    location ~* ^/(app|system|writable)/ {
        deny all;
        return 404;
    }

    # Static file caching (highly recommended for performance)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        log_not_found off;
        access_log off;
    }

    # WebSocket reverse proxy for real-time queue updates.
    # The PHP WS server (php spark ws:serve) listens on 127.0.0.1:8081.
    # Proxying it here lets the browser connect same-origin on the standard
    # web port — and as secure wss:// once this server block has TLS — so
    # realtime keeps working behind HTTPS. The raw 8081 port no longer needs
    # to be exposed publicly (you can drop the UFW rule for it).
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection $ws_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket connections are long-lived; keep them open (server pings
        # every 30s, which also resets these timeouts).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # PHP-FPM FastCGI Configuration
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # PHP 8.2 FPM socket (standard path on Ubuntu)
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # FastCGI timeouts to handle longer-running requests if any
        fastcgi_read_timeout 600;
        fastcgi_connect_timeout 600;
        fastcgi_send_timeout 600;
    }
}
