[global]
pid = /tmp/jeepneynvans-php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; Keep enough workers for concurrent polling/API requests without exhausting the
; 512 MB available to a Railway Free service.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
clear_env = no
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /proc/self/fd/2
; Application upload handlers enforce their own 4-5 MB image limits.
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 10M
