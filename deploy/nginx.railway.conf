user www-data www-data;
worker_processes auto;
pid /tmp/jeepneynvans-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format railway '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" request_time=$request_time';
    access_log /dev/stdout railway;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12m;
    client_body_temp_path /tmp/jeepneynvans-nginx/client;
    proxy_temp_path /tmp/jeepneynvans-nginx/proxy;
    fastcgi_temp_path /tmp/jeepneynvans-nginx/fastcgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    map $forwarded_proto $fastcgi_https {
        default off;
        https on;
    }

    upstream php_backend {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    upstream websocket_backend {
        server 127.0.0.1:__WEBSOCKET_PORT__;
    }

    server {
        listen __RAILWAY_PORT__;
        server_name _;
        root /app/public;
        index index.php;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Keep the browser and WebSocket daemon on the same Railway domain.
        location = /ws {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # CodeIgniter uses a single public front controller.
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_pass php_backend;
            fastcgi_keep_conn on;
            fastcgi_read_timeout 60s;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }
    }
}
