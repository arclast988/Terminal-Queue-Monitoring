name: Browser compatibility

on:
  push:
    branches: [main, master]
    paths: ['app/**', 'public/**', 'tests/frontend/**', '.github/workflows/browser-compatibility.yml']
  pull_request:
    paths: ['app/**', 'public/**', 'tests/frontend/**', '.github/workflows/browser-compatibility.yml']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: npm ci --prefix tests/frontend --ignore-scripts --no-audit --no-fund
      - run: tests/frontend/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Verify vehicle route selection and dispatcher password layout
        env:
          TQ_BROWSER: ${{ matrix.browser }}
        run: >-
          node --test --test-name-pattern='vehicle autocomplete validation|dispatcher password guidelines'
          tests/frontend/responsive.browser.cjs
      - name: Verify reports, themes, selection, touch filters, and loader behavior
        env:
          TQ_BROWSER: ${{ matrix.browser }}
        run: >-
          node --test
          --test-name-pattern='departure rule Select|activity logs use|text fill|header clock follows|commuter departure filters|terminal names|daily queue clearing|24-hour picker|phone, tablet|native form values|mobile in-page'
          tests/frontend/time-theme.browser.cjs
          tests/frontend/native-navigation-loader.browser.cjs
      - name: Verify record order follows filters and printing
        env:
          TQ_BROWSER: ${{ matrix.browser }}
        run: node --test --test-name-pattern='record sort' tests/frontend/report-filters.browser.cjs
