name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jeepney_user
          POSTGRES_PASSWORD: jeepney_pass
          POSTGRES_DB: jeepneynvans_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U jeepney_user -d jeepneynvans_test" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: intl, mbstring, pgsql, pdo_pgsql
        coverage: xdebug

    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Configure Environment
      run: |
        cp env .env
        {
          echo ""
          echo "CI_ENVIRONMENT = testing"
          echo ""
          echo "database.default.hostname = 127.0.0.1"
          echo "database.default.database = jeepneynvans_test"
          echo "database.default.username = jeepney_user"
          echo "database.default.password = jeepney_pass"
          echo "database.default.DBDriver = Postgre"
          echo "database.default.DBPrefix ="
          echo "database.default.port = 5432"
          echo ""
          echo "database.tests.hostname = 127.0.0.1"
          echo "database.tests.database = jeepneynvans_test"
          echo "database.tests.username = jeepney_user"
          echo "database.tests.password = jeepney_pass"
          echo "database.tests.DBDriver = Postgre"
          echo "database.tests.DBPrefix ="
          echo "database.tests.port = 5432"
        } >> .env

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h 127.0.0.1 -U jeepney_user -d jeepneynvans_test; do
          echo 'waiting for postgres...'
          sleep 1
        done
      env:
        PGPASSWORD: jeepney_pass

    - name: Check PHP Syntax (Lint)
      run: find . -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n 1 -P 8 php -l

    - name: Run Database Migrations
      run: php spark migrate

    - name: Run Tests
      run: vendor/bin/phpunit